name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build static demo pages
        run: |
          bun build apps/showcase/index.html   --outdir=_site/showcase --minify
          bun build examples/lyrics/index.html --outdir=_site/lyrics   --minify
          bun build examples/hello/index.html  --outdir=_site/hello    --minify
          bun build examples/model/index.html  --outdir=_site/model    --minify
          bun build examples/game/index.html   --outdir=_site/game     --minify
          cp apps/site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
