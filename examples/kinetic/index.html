<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307070a'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23f5a50c' font-family='sans-serif' font-weight='900'%3EY%3C/text%3E%3C/svg%3E" />
    <title>YURA WEB TYPE MOTION</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --bg: #07070c; --ink: #f1f5f9; --dim: #7c8799; --line: #1d2230; --accent: #22d3ee; --yura-split-a: #ff2a6d; --yura-split-b: #22d3ee; }
      html, body { height: 100%; background: var(--bg); color: var(--ink); }
      body { font-family: 'Hiragino Sans', 'Noto Sans JP', ui-sans-serif, system-ui, sans-serif; display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100vh; overflow: hidden; }
      main { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }
      header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
      header h1 { font-size: 12px; letter-spacing: 0.3em; font-weight: 700; color: var(--accent); margin-right: auto; }
      select, button, input { font: inherit; font-size: 12px; color: var(--ink); background: #10131c; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
      button { cursor: pointer; }
      button:hover, select:hover { border-color: var(--accent); }
      label { font-size: 11px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
      #stage { position: relative; overflow: hidden; font-weight: 800; background: radial-gradient(ellipse at 50% 60%, #151a2b 0%, var(--bg) 70%); }
      #caption { padding: 12px 18px 16px; border-top: 1px solid var(--line); min-height: 76px; }
      #caption .names { font-size: 12px; color: var(--accent); letter-spacing: 0.08em; }
      #caption .desc { font-size: 13px; color: var(--dim); margin-top: 6px; line-height: 1.6; }
      aside { border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 0; }
      aside h2 { font-size: 11px; letter-spacing: 0.2em; color: var(--dim); padding: 14px 18px 6px; }
      aside button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; background: transparent; padding: 8px 18px; }
      aside button:hover, aside button[aria-pressed='true'] { background: #10131c; }
      aside button[aria-pressed='true'] b { color: var(--accent); }
      aside b { font-size: 13px; font-weight: 600; }
      aside code { font-size: 11px; color: var(--dim); margin-left: 6px; }
      @media (max-width: 760px) {
        body { grid-template-columns: 1fr; grid-template-rows: 60vh 1fr; }
        aside { border-left: 0; border-top: 1px solid var(--line); }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>WEB TYPE MOTION</h1>
        <label>雰囲気 <select id="mood"></select></label>
        <label>BPM <input id="bpm" type="number" min="40" max="240" value="120" style="width: 64px" /></label>
        <button id="shuffle" title="R">おまかせ ↻</button>
      </header>
      <div id="stage"></div>
      <div id="caption" aria-live="polite"><div class="names"></div><div class="desc"></div></div>
    </main>
    <aside id="catalog" aria-label="表現一覧"></aside>
    <script src="../_shared/unbundled-notice.js"></script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
