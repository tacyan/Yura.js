<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YURA EFFECTS</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { background: #0c0c10; color: #eee; font-family: 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; }
      :root { --yura-bg: #111118; --yura-fg: #f4f1ea; --yura-accent: #ff4d6d; --yura-accent2: #4dd6ff; --yura-dim: #23232e; }
      header { padding: 32px 24px 8px; }
      header h1 { font-size: 28px; letter-spacing: 0.04em; }
      header p { color: #999; margin-top: 6px; font-size: 14px; }
      nav { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; padding: 10px 24px; background: rgba(12,12,16,0.9); backdrop-filter: blur(8px); }
      nav button { font: 600 13px system-ui; color: #ccc; background: #1c1c24; border: 0; padding: 8px 14px; border-radius: 99px; cursor: pointer; }
      nav button[aria-pressed='true'] { background: #ff4d6d; color: #111; }
      main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 16px 24px 48px; }
      .tile { position: relative; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: var(--yura-bg); color: var(--yura-fg); isolation: isolate; }
      .tile .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; }
      .tile .fxo { position: absolute; inset: 0; pointer-events: none; }
      .tile .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; font-size: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.75)); color: #fff; z-index: 3; }
      .tile .label b { font-family: ui-monospace, monospace; font-weight: 600; color: #ffb3c1; margin-right: 6px; }
      .tile.light { --yura-bg: #f4efe4; --yura-fg: #1d2a44; }
    </style>
  </head>
  <body>
    <header>
      <h1>Yura.js — 文字処理・背景・画面効果・組み</h1>
      <p>すべて CSS / SVG と純粋関数。タイルをクリックすると名前をコピーします。</p>
    </header>
    <nav>
      <button data-tab="treat" aria-pressed="true">文字処理</button>
      <button data-tab="bg">背景</button>
      <button data-tab="fx">画面効果</button>
      <button data-tab="layout">組み</button>
    </nav>
    <main id="grid"></main>
    <script src="../_shared/unbundled-notice.js"></script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
