<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORB RUSH — a Yura.js game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #06070c; color: #e2e8f0; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
      #game { position: fixed; inset: 0; }
      .hint {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
        font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #64748b;
        pointer-events: none; letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <p class="hint">WASD / ARROWS to roll &middot; SPACE to jump &middot; R to restart &middot; collect every orb</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
